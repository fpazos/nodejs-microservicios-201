apiVersion: apps/v1
kind: Deployment
metadata:
  name: eco
spec:
  # Cuántos Pods mantiene el Deployment. Con 1, el Service tendrá
  # un solo endpoint cuando el selector coincida con la etiqueta.
  replicas: 1
  selector:
    matchLabels:
      app: eco
  template:
    metadata:
      labels:
        app: eco
    spec:
      containers:
        - name: eco
          image: ms-eco-lab:lab
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: eco
spec:
  # El Service no busca el Deployment por su nombre. Se queda con los
  # Pods cuya etiqueta coincide con este selector. La etiqueta del Pod
  # está en el template de arriba: si no es la misma, ENDPOINTS sale vacío.
  selector:
    app: eco-mal
  ports:
    - port: 3001
      targetPort: 3001
