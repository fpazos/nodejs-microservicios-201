# El nombre del proyecto empieza por ms- para que scripts/limpiar-entorno.sh lo borre.
name: ms-lab-proxy
services:
  facturas:
    build: ./facturas
    container_name: ms-lab-facturas
  gateway:
    build: ./gateway
    container_name: ms-lab-proxy-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./gateway:/app/codigo
    depends_on:
      - facturas
