services:
  caja-1:
    build: ./caja
    container_name: ms-lab-caja-1
    environment:
      CAJA: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
  caja-2:
    build: ./caja
    container_name: ms-lab-caja-2
    environment:
      CAJA: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
  almacen:
    build: ./almacen
    container_name: ms-lab-almacen
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
  proxy:
    image: haproxy:3.2-alpine
    container_name: ms-lab-haproxy
    ports:
      - "8080:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      caja-1:
        condition: service_healthy
      caja-2:
        condition: service_healthy
      almacen:
        condition: service_healthy
