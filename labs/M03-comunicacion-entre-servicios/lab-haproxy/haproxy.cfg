global
    log stdout format raw local0 info
    maxconn 256

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 10s
    timeout server 10s
    timeout check 1s
    retries 2
    option redispatch

frontend entrada
    bind *:8080
    # /salud lo responde HAProxy. No llega a caja ni a almacen.
    monitor-uri /salud
    stats enable
    stats uri /stats
    stats refresh 5s

    # Las acl y los use_backend se añaden aquí, dentro del frontend.

# Los backend se añaden debajo. La palabra backend va en la columna 0.
