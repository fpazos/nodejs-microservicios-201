services:
  consul:
    image: hashicorp/consul:1.20
    container_name: ms-lab-consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
  prefijos:
    build: ./prefijos
    container_name: ms-lab-prefijos
    ports:
      - "3001:3001"
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      - consul
