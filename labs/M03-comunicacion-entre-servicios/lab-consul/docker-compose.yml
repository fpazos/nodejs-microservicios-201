services:
  consul:
    image: hashicorp/consul:1.20
    container_name: ms-lab-consul
    command: agent -dev -client=0.0.0.0 -ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8500/v1/status/leader"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
  prefijos:
    build: ./prefijos
    container_name: ms-lab-prefijos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    environment:
      CONSUL_HTTP_ADDR: http://host.docker.internal:8500
    depends_on:
      consul:
        condition: service_healthy
