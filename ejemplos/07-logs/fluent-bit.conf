[SERVICE]
    Flush        1
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               notas.*
    Refresh_Interval  2

[FILTER]
    Name    grep
    Match   *
    Regex   log nota creada

[OUTPUT]
    Name               es
    Match              *
    Host               elasticsearch
    Port               9200
    Index              notas-logs
    Suppress_Type_Name On
