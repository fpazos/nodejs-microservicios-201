services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: ms-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: ms-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  notas:
    build: .
    container_name: ms-notas-log
    ports:
      - "3001:3001"
  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: ms-fluent
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # lee el json del contenedor; la app no envía a Elasticsearch
    depends_on:
      - elasticsearch
      - notas
