services:
  mostrador-a:
    build: ./mostrador
    container_name: ms-haproxy-mostrador-a
    environment:
      MOSTRADOR: a
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
  mostrador-b:
    build: ./mostrador
    container_name: ms-haproxy-mostrador-b
    environment:
      MOSTRADOR: b
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
  avisos:
    build: ./avisos
    container_name: ms-haproxy-avisos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
  proxy:
    image: haproxy:3.2-alpine
    container_name: ms-haproxy
    ports:
      - "8080:8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      mostrador-a:
        condition: service_healthy
      mostrador-b:
        condition: service_healthy
      avisos:
        condition: service_healthy
