# El nombre del proyecto empieza por ms- para que scripts/limpiar-entorno.sh lo borre.
name: ms-consul
services:
  consul:
    image: hashicorp/consul:1.20
    container_name: ms-consul-reloj
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
  reloj:
    build: ./reloj
    # Dos réplicas: sin container_name, Compose las llama ms-consul-reloj-1 y -2.
    deploy:
      replicas: 2
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      - consul
  cliente:
    build: ./cliente
    container_name: ms-reloj-cliente
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      - reloj
