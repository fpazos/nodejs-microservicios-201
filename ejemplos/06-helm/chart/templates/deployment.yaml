apiVersion: apps/v1
kind: Deployment
metadata:
  name: eco
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: eco
  template:
    metadata:
      labels:
        app: eco
    spec:
      containers:
        - name: eco
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
