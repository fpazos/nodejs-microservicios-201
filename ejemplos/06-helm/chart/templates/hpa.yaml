apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eco
  minReplicas: 2 # declarado aquí; sin metrics-server el objetivo de CPU queda unknown y no mueve réplicas
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
